<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roshan Christy — Narrative, Game &amp; Puzzle Designer</title>
    <meta
      name="description"
      content="Portfolio of Roshan Christy — Narrative Designer, Game Designer, Level Designer, and Writer based in Toronto, Canada."
    />
    <link rel="icon" type="image/jpeg" href="./images/ludonode-logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        const pref = localStorage.getItem('theme-preference') || 'system';
        const isDark =
          pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
  </head>
  <body class="bg-[#FAF8F5] text-slate-800 antialiased selection:bg-violet-200 selection:text-slate-900 dark:bg-slate-950 dark:text-slate-100 dark:selection:bg-violet-800 dark:selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
